# 历史样例，不参与部署。
# 这是切流前（P0–P3）的迁移期矩阵：账号、互动、OAuth 等前缀当时仍指向单体（catalog:8080），
# 而线上编排里的服务名是 backend、并没有 catalog 这个服务——照它部署会把账号前缀打回目录服务。
# 保留此文件只为追溯"当时是怎么切流的"。唯一生效的矩阵在主仓库 MetaFusion 的 deploy/nginx.conf，
# 一致性由 scripts/check_gateway_matrix.py 强制；本目录的文件不要挂进任何容器。
# 各 location 共用的反代头：单独成文件，避免十几处复制粘贴漂移。
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
