worker_processes auto;
events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # 整盘镜像与视频直传；应用层的其它上限各自收敛。
    client_max_body_size 2048m;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # 限流命中返回 429 而不是默认的 503：503 与"上游不可用"撞码，客户端无法区分，
    # 与应用自身的限流口径（429 + Retry-After）也保持一致。
    limit_req_status 429;
    limit_req_log_level warn;
    limit_conn_status 429;

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        # ------------------------------------------------------------------------------
        # 迁移期路由矩阵。每个前缀只有一行 "set $x_backend"：切流 = 改这一行，回滚同理。
        # 目标是"按前缀分流到各自治服务"，但在对应服务实现并验收前，前缀继续指回
        # 元数据单体（catalog），保证线上始终可用。切流顺序见主仓库
        # docs/architecture/service-split-migration.md 的 P1-P4。
        # ------------------------------------------------------------------------------

        # 1. 账号：目标 http://auth:8081（metafusion-auth）
        #    迁移期单体已提供 /api/auth/*、/api/setup、/api/admin/users、/api/oauth/*、
        #    /api/.well-known/*、/api/oidc/jwks，因此这里先指 catalog。
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            set $auth_backend http://catalog:8080;
            proxy_pass $auth_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        location = /api/setup {
            limit_req zone=auth_limit burst=10 nodelay;
            set $auth_backend http://catalog:8080;
            proxy_pass $auth_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        location /api/admin/users {
            set $auth_backend http://catalog:8080;
            proxy_pass $auth_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        # 账号域的 /api/admin/*：权限组、权限码、实例设置、邀请码。它们与目录侧的
        # /api/admin/*（货架、外部库、定义…）共前缀，必须逐个精确匹配——
        # 否则会落到目录服务，表现为 404（前端会以为接口不存在）。
        location = /api/admin/groups {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/admin/groups/[^/]+$ {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/admin/permissions {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/admin/settings {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/admin/invites {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/admin/invites/[^/]+/revoke$ {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/oauth/ {
            set $auth_backend http://catalog:8080;
            proxy_pass $auth_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        location /api/oidc/ {
            set $auth_backend http://catalog:8080;
            proxy_pass $auth_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        # 当前 issuer 基址是 https://findverse.cc/api，discovery 挂在 /api/.well-known 下；
        # 账号服务上线后 discovery 迁到根路径 /.well-known/*，那条 location 才会生效。
        location /api/.well-known/ {
            set $auth_backend http://catalog:8080;
            proxy_pass $auth_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        location /.well-known/ {
            set $auth_backend http://auth:8081;
            proxy_pass $auth_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        # 2. 元数据目录：MetaFusion 主仓库（catalog:8080），拆分后仍然只负责这一块。
        location /api/catalog/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $catalog_backend http://catalog:8080;
            proxy_pass $catalog_backend;
            include /etc/nginx/metafusion-proxy.conf;
            proxy_read_timeout 300s;
        }

        # 3. 互动（论坛、短评、收藏、记录）：目标 http://community:8083
        location /api/community/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $community_backend http://catalog:8080;
            proxy_pass $community_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        location /api/favorites/ {
            set $community_backend http://catalog:8080;
            proxy_pass $community_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        location /api/records/ {
            set $community_backend http://catalog:8080;
            proxy_pass $community_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        # 用户收藏与用户资料同前缀：用精确正则单独分流，其余 /api/users/* 归目录。
        location ~ ^/api/users/[^/]+/favorites$ {
            set $community_backend http://catalog:8080;
            proxy_pass $community_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        # 4. 存储：目标 http://storage:8082（metafusion-storage，/api/storage/* 已实现）；
        #    单体当前提供的是 /api/archive|playback|media，两条前缀在切流期并存。
        location /api/storage/ {
            set $storage_backend http://storage:8082;
            proxy_pass $storage_backend;
            include /etc/nginx/metafusion-proxy.conf;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location /api/archive/ {
            set $storage_backend http://catalog:8080;
            proxy_pass $storage_backend;
            include /etc/nginx/metafusion-proxy.conf;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location /api/playback/ {
            set $storage_backend http://catalog:8080;
            proxy_pass $storage_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        location /api/media/ {
            set $storage_backend http://catalog:8080;
            proxy_pass $storage_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        # 5. 其余 API 与图片上传仍属目录单体。
        location /api/ {
            proxy_request_buffering off;
            limit_req zone=api_limit burst=50 nodelay;
            set $catalog_backend http://catalog:8080;
            proxy_pass $catalog_backend;
            include /etc/nginx/metafusion-proxy.conf;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /uploads/ {
            set $catalog_backend http://catalog:8080;
            proxy_pass $catalog_backend;
            include /etc/nginx/metafusion-proxy.conf;
            add_header Access-Control-Allow-Origin * always;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # 6. 文档站与前端。
        location /docs/ {
            set $docs_backend http://docs:3001;
            proxy_pass $docs_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }

        location / {
            set $frontend_backend http://frontend:3000;
            proxy_pass $frontend_backend;
            include /etc/nginx/metafusion-proxy.conf;
        }
    }
}
